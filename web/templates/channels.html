<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" type="image/svg+xml" href="{{ url_for('static',filename='favicon.svg',v='2') }}"><title>Chief of Staff · Slack channels</title><link rel="stylesheet" href="{{ url_for('static',filename='portal.css') }}"></head><body><main class="auth-page"><section class="panel"><p class="eyebrow">{{ connection.label }}</p><h1>Choose your channels.</h1><p>Select up to five channels. Only channels the bot has joined appear here. Invite Chief of Staff into a channel in Slack, then reload this page.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">{% for channel in channels %}<label class="check"><input type="checkbox" name="channels" value="{{ channel.id }}" {{ 'checked' if channel.id in selected else '' }}>#{{ channel.name }}</label>{% else %}<p>No joined channels found yet.</p>{% endfor %}<button class="btn primary">Save channels</button> <a href="{{ url_for('index',view='connections') }}">Back to connections</a></form></section></main></body></html>
