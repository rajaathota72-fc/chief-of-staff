# /etc/nginx/sites-available/chief-of-staff -> symlink into sites-enabled.
# Run `certbot --nginx -d your-domain.example` afterwards; it rewrites this
# file in place to add the HTTPS server block and redirect. Don't hand-add
# a self-signed cert here - certbot owns that part.

server {
    listen 80;
    server_name your-domain.example;

    location / {
        proxy_pass http://127.0.0.1:5087;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
