<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" type="image/svg+xml" href="{{ url_for('static',filename='favicon.svg',v='2') }}"><title>Chief of Staff · Sign in</title><link rel="stylesheet" href="{{ url_for('static',filename='portal.css') }}"></head><body><main class="auth-page"><div class="panel"><p class="eyebrow">CHIEF OF STAFF</p><h1>Your work, moving quietly.</h1><p>Sign in to your private workspaces.</p>{% for category,message in get_flashed_messages(with_categories=true) %}<p class="notice {{ category }}">{{ message }}</p>{% endfor %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label for="password">Owner password</label><input type="password" id="password" name="password" autocomplete="current-password" required><button class="btn primary">Sign in</button></form></div>{% include '_footer.html' %}</main></body></html>
