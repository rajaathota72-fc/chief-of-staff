<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" type="image/svg+xml" href="{{ url_for('static',filename='favicon.svg') }}"><title>Jira sites · Chief of Staff</title><link rel="stylesheet" href="{{ url_for('static',filename='portal.css') }}"></head><body><main class="auth-page"><section class="panel"><p class="eyebrow">{{ connection.label }}</p><h1>Choose this organization’s sites.</h1><p>Only selected sites will be included in this organization’s agent context.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">{% for site in connection.metadata.sites %}<label class="check"><input type="checkbox" name="sites" value="{{ site.id }}" {{ 'checked' if site.id in connection.metadata.get('selected_sites',[]) else '' }}>{{ site.name }} · {{ site.url }}</label>{% endfor %}<button class="btn primary">Save sites</button> <a href="{{ url_for('index',view='connections') }}">Back to connections</a></form></section></main></body></html>
