<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" type="image/svg+xml" href="{{ url_for('static',filename='favicon.svg') }}"><title>GitHub repositories · Chief of Staff</title><link rel="stylesheet" href="{{ url_for('static',filename='portal.css') }}"></head><body><main class="auth-page"><section class="panel"><p class="eyebrow">{{ connection.label }}</p><h1>Choose your repositories.</h1><p>Select up to ten repositories. Only repositories this account can access appear here.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">{% for repo in repos %}<label class="check"><input type="checkbox" name="repos" value="{{ repo.full_name }}" {{ 'checked' if repo.full_name in selected else '' }}>{{ repo.full_name }}</label>{% else %}<p>No accessible repositories found.</p>{% endfor %}<button class="btn primary">Save repositories</button> <a href="{{ url_for('index',view='connections') }}">Back to connections</a></form></section></main></body></html>
